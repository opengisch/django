services:
  postgis:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: "${POSTGIS_USER:-django}"
      POSTGRES_PASSWORD: "${POSTGIS_PASSWORD:-django}"
      POSTGRES_DB: "${POSTGIS_NAME:-geodjango}"
    volumes:
      - type: volume
        source: django-postgis-data
        target: /var/lib/postgresql
      - type: bind
        source: docker/postgis-init-other-db.sh
        target: /docker-entrypoint-initdb.d/postgis-init-other-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER:-django} -d ${POSTGIS_NAME:-geodjango}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django_geos3_12_3: &default-django
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: "${PYTHON_VERSION:-3.13}"
        UV_VERSION: "${UV_VERSION:-0.8.3}"
        GEOS_VERSION: "${GEOS_VERSION:-3.12.3}"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"

    depends_on:
      postgis:
        condition: service_healthy

    working_dir: /workspace

    volumes:
      # Django source tree.
      - type: bind
        source: .
        target: /workspace

      # Keep uv downloads outside the source tree.
      - type: volume
        source: django-uv-cache
        target: /home/django/.cache/uv

      # Avoid storing the Linux virtual environment on a macOS or Windows
      # bind mount. Each GEOS variant gets its own venv volume so the
      # containers can be built/run concurrently without racing on the
      # same `uv pip install --editable .` target.
      - type: volume
        source: django-venv-geos3-12-3
        target: /workspace/.venv

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_CACHE_DIR: /home/django/.cache/uv
      UV_PROJECT_ENVIRONMENT: /workspace/.venv
      UV_LINK_MODE: copy
      POSTGIS_HOST: postgis
      POSTGIS_PORT: "5432"
      POSTGIS_USER: "${POSTGIS_USER:-django}"
      POSTGIS_PASSWORD: "${POSTGIS_PASSWORD:-django}"
      POSTGIS_NAME: "${POSTGIS_NAME:-geodjango}"

    # This repository is the Django framework itself, not a Django project, so
    # there is no manage.py to run. Keep the development container open by
    # default. Override this command to run tests, for example:
    # docker compose run --rm django python tests/runtests.py auth_tests
    command: bash

    init: true
    stdin_open: true
    tty: true

  django_geos3_13_0:
    <<: *default-django
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GEOS_VERSION: "${GEOS_VERSION:-3.13.0}"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: django-uv-cache
        target: /home/django/.cache/uv
      - type: volume
        source: django-venv-geos3-13-0
        target: /workspace/.venv

  django_geos3_13_1:
    <<: *default-django
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GEOS_VERSION: "${GEOS_VERSION:-3.13.1}"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: django-uv-cache
        target: /home/django/.cache/uv
      - type: volume
        source: django-venv-geos3-13-1
        target: /workspace/.venv

  django_geos3_14_0:
    <<: *default-django
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GEOS_VERSION: "${GEOS_VERSION:-3.14.0}"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: django-uv-cache
        target: /home/django/.cache/uv
      - type: volume
        source: django-venv-geos3-14-0
        target: /workspace/.venv

  django_geos3_14_1:
    <<: *default-django
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GEOS_VERSION: "${GEOS_VERSION:-3.14.1}"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: django-uv-cache
        target: /home/django/.cache/uv
      - type: volume
        source: django-venv-geos3-14-1
        target: /workspace/.venv

  django_geos3_15_0:
    <<: *default-django
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GEOS_VERSION: "${GEOS_VERSION:-3.15.0}"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: django-uv-cache
        target: /home/django/.cache/uv
      - type: volume
        source: django-venv-geos3-15-0
        target: /workspace/.venv

volumes:
  django-uv-cache:
  django-venv-geos3-12-3:
  django-venv-geos3-13-0:
  django-venv-geos3-13-1:
  django-venv-geos3-14-0:
  django-venv-geos3-14-1:
  django-venv-geos3-15-0:
  django-postgis-data:
